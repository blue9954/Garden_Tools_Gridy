[project]
name = "garden-tools-gridy"
version = "1.0.3"
description = "Local photo collage app for Windows"
requires-python = ">=3.12"
dependencies = ["Pillow==12.3.0", "PySide6-Essentials==6.12.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

